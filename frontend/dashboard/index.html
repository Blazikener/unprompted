<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard · Unprompted</title>
<meta name="description" content="Your creator receipts, brand searches and manager roster in one place.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Host+Grotesk:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&family=Instrument+Serif:ital@0;1&family=Newsreader:ital,opsz,wght@1,6..72,400;1,6..72,500&display=swap">
<link rel="stylesheet" href="/ui/ui.css?v=2">
<script src="/ui/ui.js?v=2"></script>
<script src="/ui/motion.js?v=1" defer></script>
<style>
@layer page {
  :root { --dash-ink: #d0f854; }
  body { min-width: 320px; }
  .dash-bar { position: sticky; inset-block-start: 0; z-index: var(--z-sticky); min-height: 64px; }
  .dash-bar .grow { flex: 1; }
  .dash-main { width: min(1440px, 100% - clamp(28px, 6vw, 88px)); margin-inline: auto; padding-block: clamp(28px, 4vw, 56px) 80px; }
  .dash-hero { position: relative; isolation: isolate; display: flex; justify-content: space-between; align-items: end; gap: var(--s-5); padding: clamp(24px, 4vw, 48px);
               border: 1px solid var(--border); border-radius: var(--r-5); overflow: hidden; background: var(--surface-2); }
  .dash-hero::before { position: absolute; z-index: -1; inset: 0; content: ""; opacity: 0.8; pointer-events: none;
                       background: radial-gradient(ellipse at 84% 10%, oklch(0.72 0.17 132 / 0.16), transparent 42%),
                                   repeating-linear-gradient(135deg, transparent 0 23px, var(--grid-line) 24px, transparent 25px); }
  .dash-title { max-width: 780px; font: 500 clamp(2.35rem, 1.55rem + 4vw, 5rem)/0.98 var(--display); letter-spacing: -0.06em; text-wrap: balance; }
  .dash-title em { display: block; margin-top: 6px; color: var(--text-2); font: italic 400 0.78em/1.1 var(--voice); letter-spacing: -0.035em; }
  .dash-intro { max-width: 54ch; margin-top: var(--s-3); color: var(--text-2); }
  .dash-kicker, .panel-kicker { color: var(--text-3); font: 500 var(--fs-xs)/1.2 var(--mono); letter-spacing: 0.11em; text-transform: uppercase; }
  .account-block { display: grid; justify-items: end; gap: var(--s-2); flex: none; }
  .account-line { display: flex; flex-wrap: wrap; align-items: center; justify-content: end; gap: var(--s-2); }
  .account-email { color: var(--text-2); font-size: var(--fs-sm); }
  .account-actions { display: flex; flex-wrap: wrap; justify-content: end; gap: var(--s-2); }
  .dash-layout { display: grid; grid-template-columns: 210px minmax(0, 1fr); gap: clamp(20px, 3vw, 40px); align-items: start; margin-top: var(--s-5); }
  .dash-rail { position: sticky; inset-block-start: 84px; padding: var(--s-3); border: 1px solid var(--border); border-radius: var(--r-4); background: var(--surface-2); }
  .rail-label { margin: 0 var(--s-2) var(--s-2); color: var(--text-3); font: 500 var(--fs-xs)/1.3 var(--mono); letter-spacing: 0.1em; text-transform: uppercase; }
  .tab-list { display: grid; gap: 4px; }
  .tab { display: flex; justify-content: space-between; align-items: center; gap: var(--s-2); width: 100%; min-height: 42px; padding: 0 var(--s-3); border: 1px solid transparent;
         border-radius: var(--r-2); color: var(--text-2); background: transparent; font: 500 var(--fs-sm) var(--sans); text-align: start; cursor: pointer; }
  .tab:hover { color: var(--text); background: var(--surface-3); }
  .tab[aria-selected="true"] { color: var(--text); border-color: var(--border); background: var(--surface); box-shadow: var(--shadow-lift); }
  .tab[aria-selected="true"]::before { width: 7px; height: 7px; margin-inline-end: 3px; border-radius: 50%; background: var(--highlight); content: ""; }
  .tab[aria-selected="true"] { justify-content: flex-start; }
  .rail-note { margin: var(--s-4) var(--s-2) var(--s-1); color: var(--text-3); font-size: var(--fs-xs); line-height: 1.5; }
  .mobile-tabs { display: none; }
  .dashboard-panel { min-width: 0; }
  .panel-head { display: flex; justify-content: space-between; align-items: end; gap: var(--s-3); margin-bottom: var(--s-4); }
  .panel-head h2 { margin-top: 5px; font: 600 var(--fs-3xl)/1 var(--display); letter-spacing: -0.05em; }
  .panel-head p { max-width: 54ch; color: var(--text-2); font-size: var(--fs-sm); }
  .welcome { display: flex; align-items: center; justify-content: space-between; gap: var(--s-4); margin-bottom: var(--s-4); padding: var(--s-4) var(--s-5);
             border: 1px solid color-mix(in oklch, var(--highlight) 34%, var(--border)); border-radius: var(--r-4);
             background: linear-gradient(110deg, color-mix(in oklch, var(--highlight) 9%, var(--surface)), var(--surface)); }
  .welcome strong { display: block; font: 500 var(--fs-xl)/1.2 var(--display); }
  .welcome p { margin-top: 4px; color: var(--text-2); font-size: var(--fs-sm); }
  .usage-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--s-3); margin-bottom: var(--s-5); }
  .usage-card { padding: var(--s-4); }
  .usage-head { display: flex; justify-content: space-between; gap: var(--s-2); margin-bottom: var(--s-3); color: var(--text-2); font-size: var(--fs-sm); }
  .usage-head b { color: var(--text); font: 500 var(--fs-sm) var(--mono); }
  .usage-card progress { display: block; width: 100%; height: 6px; border: 0; border-radius: var(--r-pill); overflow: hidden; background: var(--surface-3); accent-color: var(--highlight); }
  .usage-card progress::-webkit-progress-bar { border-radius: var(--r-pill); background: var(--surface-3); }
  .usage-card progress::-webkit-progress-value { border-radius: var(--r-pill); background: var(--highlight); }
  .usage-card progress::-moz-progress-bar { border-radius: var(--r-pill); background: var(--highlight); }
  .usage-caption { display: block; margin-top: var(--s-2); color: var(--text-3); font: 400 0.69rem var(--mono); }
  .metric-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--s-3); margin-bottom: var(--s-5); }
  .metric { position: relative; min-height: 146px; overflow: hidden; }
  .metric::after { position: absolute; inset-inline-end: -24px; inset-block-end: -32px; width: 110px; height: 110px; border: 1px solid var(--border); border-radius: 50%; content: ""; opacity: 0.6; }
  .metric-label { display: block; max-width: 20ch; color: var(--text-2); font-size: var(--fs-sm); }
  .metric-value { display: block; margin-top: var(--s-4); color: var(--text); font: 500 clamp(2rem, 1.3rem + 2vw, 3.2rem)/1 var(--mono); letter-spacing: -0.075em; }
  .metric-note { display: block; margin-top: var(--s-2); color: var(--text-3); font-size: var(--fs-xs); }
  .split-grid { display: grid; grid-template-columns: minmax(0, 1.18fr) minmax(0, 0.82fr); gap: var(--s-3); margin-bottom: var(--s-5); }
  .chart-card { min-width: 0; }
  .chart-head { display: flex; justify-content: space-between; align-items: start; gap: var(--s-3); margin-bottom: var(--s-3); }
  .chart-head h3 { font-size: var(--fs-lg); }
  .chart-head p { margin-top: 4px; color: var(--text-3); font-size: var(--fs-xs); }
  .chart-wrap { min-width: 0; }
  .chart-svg { width: 100%; height: auto; overflow: visible; }
  .chart-gridline { stroke: var(--border); stroke-width: 1; stroke-dasharray: 3 7; }
  .chart-axis { fill: var(--text-3); font: 10px var(--mono); }
  .chart-line { fill: none; stroke: var(--highlight); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
  .chart-area { fill: color-mix(in oklch, var(--highlight) 18%, transparent); }
  .chart-dot { fill: var(--surface); stroke: var(--highlight); stroke-width: 2; }
  .chart-bar { fill: var(--accent); transform-box: fill-box; transform-origin: bottom; animation: bar-rise 650ms var(--ease-out) both; }
  @keyframes bar-rise { from { transform: scaleY(0.04); opacity: 0.3; } to { transform: scaleY(1); opacity: 1; } }
  .chart-table { position: fixed; inset-block-start: 0; inset-inline-start: 0; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); clip-path: inset(50%); white-space: nowrap; }
  .content-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--s-3); margin-bottom: var(--s-5); }
  .content-card { min-width: 0; }
  .card-title { display: flex; justify-content: space-between; align-items: baseline; gap: var(--s-3); margin-bottom: var(--s-3); }
  .card-title h3 { font-size: var(--fs-lg); }
  .card-title a { font-size: var(--fs-sm); }
  .list { display: grid; gap: 0; margin: 0; padding: 0; list-style: none; }
  .list-row { display: flex; align-items: center; justify-content: space-between; gap: var(--s-3); min-width: 0; padding: var(--s-3) 0; border-top: 1px solid var(--border); }
  .list-row:first-child { border-top: 0; padding-top: 0; }
  .list-row:last-child { padding-bottom: 0; }
  .list-main { display: flex; align-items: center; min-width: 0; gap: var(--s-3); }
  .list-copy { min-width: 0; }
  .list-copy strong, .list-copy small { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .list-copy strong { font-size: var(--fs-sm); }
  .list-copy small { margin-top: 2px; color: var(--text-3); font-size: var(--fs-xs); }
  .list-value { flex: none; color: var(--text-2); font: 500 var(--fs-xs) var(--mono); text-align: end; }
  .dash-main .avatar { flex: none; width: 38px; height: 38px; border: 1px solid var(--border-strong); border-radius: 50%; object-fit: cover; background: var(--surface-3); color: var(--text-2); display: grid; place-items: center; }
  .brand-meter { width: clamp(40px, 12vw, 120px); height: 4px; margin-top: 5px; border-radius: var(--r-pill); background: var(--surface-3); overflow: hidden; }
  .brand-meter i { display: block; height: 100%; border-radius: inherit; background: var(--highlight); }
  .empty-state { display: grid; justify-items: start; gap: var(--s-3); padding: clamp(22px, 4vw, 40px); border: 1px dashed var(--border-strong); border-radius: var(--r-4);
                 background: linear-gradient(140deg, var(--surface), var(--surface-2)); }
  .empty-mark { display: grid; place-items: center; width: 42px; height: 42px; border: 1px solid var(--border-strong); border-radius: 50%; color: var(--highlight); font: 500 1.1rem var(--mono); }
  .empty-state h3 { font: 500 var(--fs-xl)/1.2 var(--display); }
  .empty-state p { max-width: 52ch; color: var(--text-2); }
  .quick-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--s-3); margin-top: var(--s-5); }
  .quick-card { display: grid; align-content: start; gap: var(--s-3); }
  .quick-card h3 { font-size: var(--fs-lg); }
  .quick-card p { color: var(--text-2); font-size: var(--fs-sm); }
  .quick-form { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: var(--s-2); align-items: end; }
  .quick-form .wide-field { min-width: 0; }
  .quick-form .u-input, .quick-form .u-select { min-width: 0; }
  .quick-form.scan-form { grid-template-columns: minmax(0, 1fr) 136px auto; }
  .action-grid { display: flex; flex-wrap: wrap; gap: var(--s-2); }
  .stat-strip { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: var(--s-2); margin-bottom: var(--s-4); }
  .stat-box { min-width: 0; padding: var(--s-3); border: 1px solid var(--border); border-radius: var(--r-3); background: var(--surface-2); }
  .stat-box strong { display: block; font: 500 var(--fs-xl) var(--mono); }
  .stat-box small { display: block; margin-top: 4px; color: var(--text-3); font-size: var(--fs-xs); }
  .request-funnel { display: grid; gap: var(--s-3); }
  .funnel-row { display: grid; grid-template-columns: 88px minmax(0, 1fr) 28px; align-items: center; gap: var(--s-2); color: var(--text-2); font-size: var(--fs-sm); }
  .funnel-track { height: 7px; border-radius: var(--r-pill); overflow: hidden; background: var(--surface-3); }
  .funnel-track i { display: block; height: 100%; border-radius: inherit; background: var(--highlight); }
  .funnel-row b { color: var(--text); font: 500 var(--fs-xs) var(--mono); text-align: end; }
  .account-card { display: grid; grid-template-columns: minmax(0, 1fr) minmax(220px, 0.65fr); gap: var(--s-5); }
  .account-facts { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: var(--s-3) var(--s-5); margin: 0; }
  .account-facts dt { color: var(--text-3); font-size: var(--fs-sm); }
  .account-facts dd { min-width: 0; margin: 0; overflow-wrap: anywhere; font-size: var(--fs-sm); }
  .activity-list { display: grid; gap: 0; }
  .activity-row { display: grid; grid-template-columns: 12px minmax(0, 1fr) auto; align-items: baseline; gap: var(--s-3); padding: var(--s-3) 0; border-top: 1px solid var(--border); }
  .activity-row:first-child { border-top: 0; padding-top: 0; }
  .activity-dot { width: 7px; height: 7px; margin-top: 5px; border-radius: 50%; background: var(--highlight); }
  .activity-row time { color: var(--text-3); font: 400 0.69rem var(--mono); white-space: nowrap; }
  .plan-note { color: var(--text-2); font-size: var(--fs-sm); }
  .section-gap { margin-top: var(--s-5); }
  .toast-anchor { position: fixed; inset-inline-end: var(--s-4); inset-block-end: var(--s-4); z-index: var(--z-toast); }

  @media (max-width: 960px) {
    .dash-layout { grid-template-columns: minmax(0, 1fr); }
    .dash-rail { display: none; }
    .mobile-tabs { position: sticky; inset-block-start: 64px; z-index: calc(var(--z-sticky) - 1); display: block; margin: 0 0 var(--s-4); padding: var(--s-2);
                   border: 1px solid var(--border); border-radius: var(--r-3); background: color-mix(in oklch, var(--bg) 92%, transparent); backdrop-filter: blur(16px); }
    .mobile-tabs .tab-list { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; }
    .mobile-tabs .tab-list::-webkit-scrollbar { display: none; }
    .mobile-tabs .tab { flex: 1 0 auto; justify-content: center; width: auto; min-height: 38px; padding-inline: 12px; white-space: nowrap; }
    .mobile-tabs .tab[aria-selected="true"] { justify-content: center; }
    .mobile-tabs .tab[aria-selected="true"]::before { display: none; }
  }
  @media (max-width: 700px) {
    .dash-main { width: min(100% - 28px, 560px); padding-block: 20px 56px; }
    .dash-hero { display: grid; align-items: start; gap: var(--s-4); padding: var(--s-4); }
    .account-block { justify-items: start; width: 100%; }
    .account-line, .account-actions { justify-content: start; }
    .account-email { max-width: min(70vw, 330px); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .usage-grid { grid-template-columns: minmax(0, 1fr); gap: var(--s-2); }
    .usage-card { padding: var(--s-3); }
    .usage-head { margin-bottom: var(--s-2); }
    .metric-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--s-2); }
    .metric { min-height: 132px; }
    .metric.u-card-pad { padding: var(--s-3); }
    .metric-value { margin-top: var(--s-3); font-size: clamp(1.85rem, 1.2rem + 3vw, 2.6rem); }
    .split-grid, .content-grid, .quick-grid { grid-template-columns: minmax(0, 1fr); }
    .stat-strip { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .account-card { grid-template-columns: minmax(0, 1fr); }
    .quick-form.scan-form { grid-template-columns: minmax(0, 1fr) 112px; }
    .quick-form.scan-form button { grid-column: 1 / -1; justify-self: start; }
    .panel-head { display: grid; align-items: start; }
  }
  @media (max-width: 390px) {
    .dash-bar { gap: 8px; padding-inline: 10px; }
    .dash-bar .u-logo small { display: none; }
    .dash-bar .u-aud { max-width: calc(100vw - 160px); min-width: 0; }
    .dash-bar .u-aud a { padding-inline: 4px; font-size: 0.6rem; }
    .dash-bar .dash-command { width: 34px; padding: 0; overflow: hidden; font-size: 0; }
    .dash-bar .dash-command::after { content: "⌘"; font-size: 0.9rem; }
    .mobile-tabs .tab-list { gap: 2px; }
    .mobile-tabs .tab { flex: 1 1 0; min-width: 0; padding-inline: 4px; font-size: var(--fs-xs); }
    .metric-label { font-size: 0.74rem; }
    .list-row { gap: var(--s-2); }
    .list-main { gap: var(--s-2); }
    .quick-form { grid-template-columns: minmax(0, 1fr); }
    .quick-form.scan-form { grid-template-columns: minmax(0, 1fr) 100px; }
    .quick-form .u-btn { justify-self: start; }
    .account-facts { grid-template-columns: minmax(0, 1fr); gap: 5px; }
    .account-facts dd + dt { margin-top: var(--s-2); }
  }
}
</style>
</head>
<body>
<header class="u-bar dash-bar">
  <a class="u-logo" href="/dashboard"><mark>Unprompted</mark><small>Intelligence, together</small></a>
  <nav class="u-aud" aria-label="Who it's for">
    <a href="/creators/">Creators</a><a href="/brands/">Brands</a><a href="/creators/roster">Managers</a>
  </nav>
  <span class="grow"></span>
  <button class="u-btn u-btn-ghost u-btn-sm dash-command" type="button" id="command" aria-label="Open command palette">Commands</button>
</header>

<main class="dash-main">
  <section class="dash-hero" aria-labelledby="greeting">
    <div>
      <div class="dash-kicker">Your signal, in one place</div>
      <h1 class="dash-title" id="greeting" data-split>Good morning<em>Let's see what moved.</em></h1>
      <p class="dash-intro">Your creator receipts, brand discoveries and roster reports, grounded in evidence.</p>
    </div>
    <div class="account-block">
      <div class="account-line"><span class="account-email" id="user-email"></span><span class="u-pill" id="plan-pill"></span></div>
      <div class="account-actions" id="account-actions"></div>
    </div>
  </section>

  <div class="dash-layout">
    <aside class="dash-rail" aria-label="Dashboard sections">
      <p class="rail-label">Workspace</p>
      <nav class="tab-list" role="tablist" aria-label="Dashboard sections" id="desktop-tabs"></nav>
      <p class="rail-note">One workspace for every mention worth keeping.</p>
    </aside>

    <div class="dash-content">
      <nav class="mobile-tabs" aria-label="Dashboard sections">
        <div class="tab-list" role="tablist" id="mobile-tabs"></div>
      </nav>

      <section class="dashboard-panel" id="panel-overview" role="tabpanel" tabindex="0" aria-labelledby="tab-desktop-tabs-overview"></section>
      <section class="dashboard-panel" id="panel-creator" role="tabpanel" tabindex="0" aria-labelledby="tab-desktop-tabs-creator" hidden></section>
      <section class="dashboard-panel" id="panel-brand" role="tabpanel" tabindex="0" aria-labelledby="tab-desktop-tabs-brand" hidden></section>
      <section class="dashboard-panel" id="panel-manager" role="tabpanel" tabindex="0" aria-labelledby="tab-desktop-tabs-manager" hidden></section>
      <section class="dashboard-panel" id="panel-account" role="tabpanel" tabindex="0" aria-labelledby="tab-desktop-tabs-account" hidden></section>
      <p class="u-error" id="dashboard-error" role="alert" hidden></p>
    </div>
  </div>
</main>

<script>
const { h } = U;
const $ = (s, root = document) => root.querySelector(s);
const $$ = (s, root = document) => [...root.querySelectorAll(s)];
const api = async (path, options = {}) => {
  const res = await fetch(`/api/creators${path}`, options);
  const data = await res.json().catch(() => ({}));
  if (!res.ok) { const error = new Error(data.error || res.statusText); error.status = res.status; throw error; }
  return data;
};
const tabs = [
  ['overview', 'Overview'], ['creator', 'Creator'], ['brand', 'Brand'], ['manager', 'Manager'], ['account', 'Account'],
];
const format = (value) => new Intl.NumberFormat(undefined, { maximumFractionDigits: 0 }).format(value || 0);
const compact = (value) => U.fmt(value || 0, 'compact');
const date = (value) => value ? U.date(value) : '—';
const displayPlan = { free: 'Free', open: 'Free', leads: 'Weekly leads', pro: 'Pro', roster: 'Roster' };
let data = null;

function localGreeting() {
  const hour = new Date().getHours();
  return hour < 12 ? 'Good morning' : hour < 18 ? 'Good afternoon' : 'Good evening';
}
function activateTab(name, updateUrl = true) {
  const tab = tabs.some(([key]) => key === name) ? name : 'overview';
  for (const [id] of tabs) {
    const active = id === tab;
    for (const nav of [$('#desktop-tabs'), $('#mobile-tabs')]) {
      const button = $(`[data-tab="${id}"]`, nav);
      if (button) { button.setAttribute('aria-selected', String(active)); button.tabIndex = active ? 0 : -1; }
    }
    const panel = $(`#panel-${id}`);
    if (panel) panel.hidden = !active;
  }
  if (updateUrl) {
    const url = new URL(location.href);
    if (tab === 'overview') url.searchParams.delete('as'); else url.searchParams.set('as', tab);
    history.replaceState({}, '', url.pathname + (url.search ? url.search : '') + url.hash);
  }
}
function buildTabs() {
  for (const nav of [$('#desktop-tabs'), $('#mobile-tabs')]) {
    nav.replaceChildren(...tabs.map(([id, label]) => h('button', {
      id: `tab-${nav.id}-${id}`, type: 'button', class: 'tab', role: 'tab', 'data-tab': id,
      'aria-controls': `panel-${id}`, 'aria-selected': 'false', tabindex: -1,
      onclick: () => activateTab(id),
      onkeydown: (event) => {
        if (!['ArrowLeft', 'ArrowRight', 'Home', 'End'].includes(event.key)) return;
        event.preventDefault();
        const index = tabs.findIndex(([key]) => key === id);
        const next = event.key === 'Home' ? 0 : event.key === 'End' ? tabs.length - 1
          : (index + (event.key === 'ArrowRight' ? 1 : tabs.length - 1)) % tabs.length;
        activateTab(tabs[next][0]); $(`[data-tab="${tabs[next][0]}"]`, nav).focus();
      },
    }, label)));
  }
}

    $('#dashboard-error').textContent = error.message || 'Your dashboard could not load. Try refreshing.';
  }
})();
</script>
</body>
</html>
