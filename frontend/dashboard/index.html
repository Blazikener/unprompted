<!doctype html>
<html lang="en">
<head>

<style>

  .funnel-track { height: 7px; border-radius: var(--r-pill); overflow: hidden; background: var(--surface-3); }
  .funnel-track i { display: block; height: 100%; border-radius: inherit; background: var(--highlight); }
  .funnel-row b { color: var(--text); font: 500 var(--fs-xs) var(--mono); text-align: end; }

  .activity-list { display: grid; gap: 0; }

  .activity-row:first-child { border-top: 0; padding-top: 0; }

  .activity-row time { color: var(--text-3); font: 400 0.69rem var(--mono); white-space: nowrap; }

<body>
<header class="u-bar dash-bar">
  <a class="u-logo" href="/dashboard"><mark>Unprompted</mark><small>Dashboard</small></a>
  <nav class="u-aud" aria-label="Who it's for">
    <a href="/creators/">Creators</a><a href="/brands/">Brands</a><a href="/creators/roster">Managers</a>
  </nav>
  <span class="grow"></span>
  <button class="u-btn u-btn-ghost u-btn-sm dash-command" type="button" id="command" aria-label="Open command palette">Commands</button>
  <div class="dash-account">
    <span class="account-email" id="user-email"></span>
    <span class="u-pill" id="plan-pill"></span>
    <div class="account-actions" id="account-actions"></div>
  </div>
</header>

<main class="dash-main">
  <section class="dash-hero" aria-labelledby="greeting">
    <div>
      <div class="dash-kicker">Your signal, in one place</div>
      <h1 class="dash-title" id="greeting" data-split>Good morning<em>Let's see what moved.</em></h1>
      <p class="dash-intro">Your creator receipts, brand discoveries and roster reports, grounded in evidence.</p>
    </div>
  </section>

  <div class="dash-layout">
    <aside class="dash-rail" aria-label="Dashboard sections">
      <p class="rail-label">Workspace</p>
      <nav class="tab-list" role="tablist" aria-label="Dashboard sections" id="desktop-tabs"></nav>
      <p class="rail-note">One workspace for every mention worth keeping.</p>
    </aside>

    <div class="dash-content">
      <nav class="mobile-tabs" aria-label="Dashboard sections">
        <div class="tab-list" role="tablist" id="mobile-tabs"></div>
      </nav>

      <section class="dashboard-panel" id="panel-overview" role="tabpanel" tabindex="0" aria-labelledby="tab-desktop-tabs-overview"></section>
      <section class="dashboard-panel" id="panel-creator" role="tabpanel" tabindex="0" aria-labelledby="tab-desktop-tabs-creator" hidden></section>
      <section class="dashboard-panel" id="panel-brand" role="tabpanel" tabindex="0" aria-labelledby="tab-desktop-tabs-brand" hidden></section>
      <section class="dashboard-panel" id="panel-manager" role="tabpanel" tabindex="0" aria-labelledby="tab-desktop-tabs-manager" hidden></section>
      <section class="dashboard-panel" id="panel-account" role="tabpanel" tabindex="0" aria-labelledby="tab-desktop-tabs-account" hidden></section>
      <p class="u-error" id="dashboard-error" role="alert" hidden></p>
    </div>
  </div>
</main>

<script>
const { h } = U;
const $ = (s, root = document) => root.querySelector(s);
const $$ = (s, root = document) => [...root.querySelectorAll(s)];
const api = async (path, options = {}) => {
  const res = await fetch(`/api/creators${path}`, options);
  const data = await res.json().catch(() => ({}));
  if (!res.ok) { const error = new Error(data.error || res.statusText); error.status = res.status; throw error; }
  return data;
};
const tabs = [
  ['overview', 'Overview'], ['creator', 'Creator'], ['brand', 'Brand'], ['manager', 'Manager'], ['account', 'Account'],
];
const format = (value) => new Intl.NumberFormat(undefined, { maximumFractionDigits: 0 }).format(value || 0);
const compact = (value) => U.fmt(value || 0, 'compact');
const date = (value) => value ? U.date(value) : '—';
const displayPlan = { free: 'Free', open: 'Free', leads: 'Weekly leads', pro: 'Pro', roster: 'Roster' };
let data = null;
let chartTooltipId = 0;

function localGreeting() {
  const hour = new Date().getHours();
  return hour < 12 ? 'Good morning' : hour < 18 ? 'Good afternoon' : 'Good evening';

function activateTab(name, updateUrl = true) {

      h('a', { class: 'u-btn u-btn-sm', href: '/creators/licenses' }, 'Manage offers and handles')));
  panel.replaceChildren(...[
    panelHead('Creator', 'Your receipts', summary),
    c.scans ? null : emptyState('Start with the handle your audience knows', 'Your top brands, unpaid mentions and license offers will gather here after the first scan.', 'scan', 'Run your first scan'),
    c.scans ? h('div', { class: 'action-grid' }, h('button', { class: 'u-btn u-btn-primary u-btn-sm', type: 'button', onclick: () => focusQuickForm('scan-launch') }, 'New scan')) : null,
    h('div', { class: 'content-grid section-gap' },
      card('Top brands', brands, '/creators/', 'Open receipts'),
      card('Recent scans', scans, '/creators/', 'Open Receipts')),
    card('License inbox', license, '/creators/licenses', 'Open inbox'),
  ].filter(Boolean));
  animateCounts(panel);
}
function renderBrand() {
  const panel = $('#panel-brand'), b = data.brand, r = b.licenseRequests;
  const searches = b.recentSearches.length ? searchList(b.recentSearches) :
    emptyState('No saved brand searches yet', 'Search for a brand, then save a weekly digest to keep new on-camera mentions coming.', 'brand', 'Find your first brand');
  const maxRequest = Math.max(1, r.requested, r.accepted, r.live, r.declined);
  const funnel = h('div', { class: 'request-funnel' },
    ...[['Requested', r.requested], ['Accepted', r.accepted], ['Live', r.live], ['Declined', r.declined]].map(([label, value]) =>
      h('div', { class: 'funnel-row' }, h('span', {}, label), h('span', { class: 'funnel-track' }, h('i', { style: `width:${Math.max(0, value / maxRequest * 100)}%` })), h('b', {}, format(value)))));
  const digest = h('div', { class: 'stat-strip' },
    h('div', { class: 'stat-box' }, h('strong', {}, format(b.digests.active)), h('small', {}, 'Active digests')),
    h('div', { class: 'stat-box' }, h('strong', {}, format(b.digests.pending)), h('small', {}, 'Pending confirmation')));
  panel.replaceChildren(...[
    panelHead('Brand', 'Your listening posts', 'Saved searches turn into a weekly stream of new creator mentions.'),
    b.searches ? null : emptyState('Start with a brand worth listening for', 'Search once, then receive new on-camera mentions in a weekly digest.', 'brand', 'Search for a brand'),
    b.searches ? h('div', { class: 'action-grid' }, h('button', { class: 'u-btn u-btn-primary u-btn-sm', type: 'button', onclick: () => focusQuickForm('brand-launch') }, 'New brand search')) : null,
    h('div', { class: 'content-grid' },
      card('Saved searches', searches, '/brands/', 'Open brand search'),
      card('Weekly digests', digest, '/brands/', 'Manage digests')),
    h('div', { class: 'split-grid' },
      chartCard('New mentions per week', 'Distinct videos in your brand searches, by publish week.', weeklyRows(), 'bar', 'brand'),
      card('Top creators', b.topCreators.length ? topCreatorList(b.topCreators) : emptyState('No creators found yet', 'Creators will appear as searches find on-camera brand mentions.', 'brand', 'Start a brand search'))),
    card('License requests', funnel, '/brands/', 'Review brand dashboard'),
  ].filter(Boolean));
  animateCounts(panel);
}
function renderManager() {
  const panel = $('#panel-manager'), m = data.manager;
  const summary = m.hasRoster ? 'A single view of the creators, weekly reports and deals from your roster.' : 'Bring your creator roster and weekly receipts into one place.';
  const content = m.hasRoster ? h('div', { class: 'u-stack' },
    h('div', { class: 'stat-strip' },
      ...[['Creators', m.creators], ['Reports', m.reports], ['Deals', m.deals], ['Deal value', `$${format(m.dealsUsd)}`]].map(([label, value]) =>
        h('div', { class: 'stat-box' }, h('strong', {}, value), h('small', {}, label)))),
    h('p', { class: 'plan-note' }, `Roster access: ${m.access || 'not active'} · Last report: ${date(m.lastReportAt)}`),
    h('div', { class: 'action-grid' }, h('a', { class: 'u-btn u-btn-primary', href: '/creators/roster' }, 'Open roster and reports')))
    : emptyState('Build your first creator roster', 'Add the creators you represent and get one weekly picture of brand mentions and opportunities.', '/creators/roster', 'Set up your roster');
  panel.replaceChildren(panelHead('Manager', 'Your roster', summary), content);
}
function renderAccount() {
  const panel = $('#panel-account'), user = data.user, usage = data.usage;
  const facts = h('dl', { class: 'account-facts' },
    h('dt', {}, 'Email'), h('dd', {}, user.email),
    h('dt', {}, 'Plan'), h('dd', {}, h('span', { class: `u-pill${['pro', 'roster'].includes(user.plan) ? ' u-pill-ok' : ''}` }, displayPlan[user.plan] || 'Free')),
    h('dt', {}, 'Member since'), h('dd', {}, date(data.memberSince)),
    h('dt', {}, 'Billing status'), h('dd', {}, user.billing ? 'Billing portal available' : 'No payment method on file'));
  const actions = h('div', { class: 'action-grid' },
    user.billing ? h('button', { class: 'u-btn u-btn-primary', type: 'button', onclick: openBilling }, 'Open billing portal')
      : ['pro', 'roster'].includes(user.plan) ? h('span', { class: 'u-pill u-pill-ok' }, `${displayPlan[user.plan] || 'Pro'} plan`)
        : h('a', { class: 'u-btn u-btn-primary', href: '/creators/?upgrade=pro' }, 'Explore Pro'),
    h('button', { class: 'u-btn', type: 'button', onclick: signOut }, 'Sign out'));
  panel.replaceChildren(panelHead('Account', 'Your account', 'Plan, access and billing, without leaving your workspace.'),
    h('div', { class: 'account-card' }, card('Membership', facts), card('Actions', actions)),
    h('section', { class: 'section-gap' }, h('h3', {}, 'Weekly usage'), usageSection()));
}
function render() {
  renderAccountHeader();
  renderOverview();
  renderCreator();
  renderBrand();
  renderManager();
  renderAccount();
  window.M?.scan(document);
}
$('#command').addEventListener('click', () => U.palette.open());
U.palette.add({ id: 'dashboard-home', label: 'Dashboard', hint: 'Your shared creator, brand and manager workspace', group: 'Go to', keywords: 'overview analytics dashboard', run: () => { location.href = '/dashboard'; } });
U.palette.add({ id: 'dashboard-creator', label: 'Creator dashboard', group: 'Go to', keywords: 'receipts mentions', run: () => { location.href = '/dashboard?as=creator'; } });
U.palette.add({ id: 'dashboard-brand', label: 'Brand dashboard', group: 'Go to', keywords: 'search weekly digest', run: () => { location.href = '/dashboard?as=brand'; } });
U.palette.add({ id: 'dashboard-manager', label: 'Manager dashboard', group: 'Go to', keywords: 'roster reports', run: () => { location.href = '/dashboard?as=manager'; } });

(async () => {
  buildTabs();
  try {
    data = await api('/dashboard');
    render();
    const as = new URLSearchParams(location.search).get('as') || 'overview';
    activateTab(as, false);
  } catch (error) {
    if (error.status === 401) { location.replace('/creators/?signin=1'); return; }
    $('#dashboard-error').hidden = false;
    $('#dashboard-error').textContent = error.message || 'Your dashboard could not load. Try refreshing.';
  }
})();
</script>
