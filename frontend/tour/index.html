<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The 60-second tour · Receipts</title>
<meta name="description" content="See how creators turn brand mentions into proof for their next paid collab.">
<link rel="stylesheet" href="/ui/ui.css?v=10">
<script src="/ui/ui.js?v=8"></script>
<script src="/ui/motion.js?v=2" defer></script>
<style>
@layer page {
  .tour-header { gap: var(--s-3); }
  .tour-header .u-logo { flex: none; }
  .tour-header #who { display: flex; align-items: center; gap: var(--s-2); min-width: 0; }
  .tour-email { max-width: 150px; overflow: hidden; color: var(--text-2); font-size: var(--fs-sm); text-overflow: ellipsis; white-space: nowrap; }
  .tour-skip { white-space: nowrap; }
  .tour-shell { width: min(1240px, 100% - 48px); min-height: calc(100svh - 64px); margin-inline: auto; padding-block: clamp(18px, 3vh, 36px);
                display: grid; grid-template-rows: auto 1fr auto; gap: clamp(18px, 3vh, 32px); }
  .tour-progress { display: flex; align-items: center; justify-content: space-between; gap: var(--s-4); }
  .tour-progress-label { font: 500 var(--fs-xs)/1 var(--mono); color: var(--text-2); letter-spacing: 0.06em; white-space: nowrap; }
  .tour-dots { display: flex; align-items: center; gap: 8px; }
  .tour-dot { width: 28px; height: 28px; display: grid; place-items: center; padding: 0; border: 0; border-radius: 50%; background: transparent; color: var(--text-3); cursor: pointer; }
  .tour-dot::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; transition: width 180ms var(--ease-out), border-radius 180ms var(--ease-out), color 180ms var(--ease-out); }
  .tour-dot[aria-current="step"] { color: var(--text); }
  .tour-dot[aria-current="step"]::before { width: 22px; border-radius: var(--r-pill); background: var(--highlight); }
  .tour-dot:hover { color: var(--text); }
  .tour-dot:focus-visible, .tour-choice:focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; }
  .tour-layout { display: grid; grid-template-columns: minmax(250px, 0.8fr) minmax(0, 1.2fr); align-items: center; gap: clamp(28px, 6vw, 88px); min-height: 0; }
  .tour-copy { display: grid; align-content: center; gap: var(--s-4); min-width: 0; }
  .tour-copy h1 { max-width: 10ch; font: 600 clamp(2.8rem, 3.3vw + 1rem, 5.2rem)/0.94 var(--display); letter-spacing: -0.055em; text-wrap: balance; }
  #tour-headline:focus { outline: none; }
  .tour-copy p { max-width: 35ch; color: var(--text-2); font-size: clamp(1rem, 1.2vw, 1.2rem); line-height: 1.5; }
  .tour-art { display: grid; place-items: center; min-width: 0; }
  .tour-scene { width: min(100%, 660px); min-width: 0; opacity: 0; translate: 0 12px; transition: opacity 220ms var(--ease-out), translate 220ms var(--ease-out); }
  .tour-scene.is-in { opacity: 1; translate: 0 0; }
  .tour-demo { position: relative; overflow: hidden; border: 1px solid var(--border-strong); border-radius: var(--r-4); background: var(--glass), var(--surface); box-shadow: 0 32px 90px -46px oklch(0 0 0 / 0.8); }
  .tour-video { display: grid; grid-template-columns: minmax(150px, 0.82fr) minmax(0, 1fr); min-height: 340px; padding: 12px; gap: 16px; }
  .tour-video-photo { position: relative; min-height: 0; overflow: hidden; border-radius: var(--r-3); background: var(--cinema); }
  .tour-video-photo img { width: 100%; height: 100%; object-fit: cover; }
  .tour-photo-label { position: absolute; inset: 12px auto auto 12px; padding: 5px 8px; border-radius: var(--r-pill); background: oklch(0.12 0.01 160 / 0.78); color: white; font: 500 0.6875rem var(--mono); backdrop-filter: blur(8px); }
  .tour-video-copy { align-self: center; display: grid; gap: var(--s-4); padding: clamp(4px, 1.4vw, 16px); min-width: 0; }
  .tour-creator { display: flex; align-items: center; gap: 10px; font-size: var(--fs-sm); }
  .tour-avatar { width: 34px; height: 34px; object-fit: cover; border-radius: 50%; border: 1px solid var(--border-strong); }
  .tour-video-copy q { font: italic 400 clamp(1.45rem, 2.4vw, 2.5rem)/1.15 var(--voice); quotes: "\201C" "\201D"; }
  .tour-video-copy mark, .tour-receipt mark { padding-inline: 3px; border-radius: 3px; background: var(--highlight); color: var(--on-highlight); }
  .tour-time { color: var(--text-2); font: 500 var(--fs-xs) var(--mono); }
  .tour-receipt { max-width: 580px; margin-inline: auto; padding: clamp(16px, 3vw, 30px); display: grid; gap: var(--s-4); }
  .tour-receipt-head, .tour-proof-head { display: flex; align-items: center; justify-content: space-between; gap: var(--s-3); }
  .tour-receipt-grid { display: grid; grid-template-columns: minmax(110px, 0.7fr) minmax(0, 1.3fr); gap: var(--s-4); align-items: center; }
  .tour-receipt-grid img { width: 100%; height: 210px; object-fit: cover; border-radius: var(--r-3); background: var(--cinema); }
  .tour-receipt q { font: italic 400 clamp(1.2rem, 2vw, 1.8rem)/1.2 var(--voice); quotes: "\201C" "\201D"; }
  .tour-metrics { display: flex; flex-wrap: wrap; gap: 8px; }
  .tour-metrics span, .tour-proof-label { display: inline-flex; align-items: center; gap: 6px; padding: 6px 9px; border: 1px solid var(--border); border-radius: var(--r-pill); color: var(--text-2); font: 500 var(--fs-xs) var(--mono); }
  .tour-said { color: var(--on-highlight) !important; border-color: transparent !important; background: var(--highlight) !important; }
  .tour-pitch { max-width: 600px; margin-inline: auto; padding: clamp(16px, 3vw, 30px); display: grid; gap: var(--s-4); }
  .tour-pitch-title { display: grid; gap: 7px; min-width: 0; }
  .tour-pitch-title strong { font-size: clamp(1.15rem, 2vw, 1.6rem); letter-spacing: -0.03em; overflow-wrap: anywhere; }
  .tour-pitch-money { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: var(--s-2); }
  .tour-pitch-money b { font: 600 clamp(1.6rem, 3vw, 2.5rem)/1 var(--display); letter-spacing: -0.04em; }
  .tour-pitch-money span { color: var(--text-2); font-size: var(--fs-sm); }
  .tour-proof { display: grid; grid-template-columns: 56px minmax(0, 1fr); align-items: center; gap: var(--s-3); padding: var(--s-3); border: 1px solid var(--border); border-radius: var(--r-3); background: var(--surface-2); }
  .tour-proof img { width: 56px; height: 66px; object-fit: cover; border-radius: var(--r-1); }
  .tour-proof-copy { display: grid; gap: 5px; min-width: 0; }
  .tour-proof-copy q { overflow: hidden; color: var(--text-2); font: italic 400 1rem/1.25 var(--voice); text-overflow: ellipsis; white-space: nowrap; }
  .tour-search { max-width: 620px; margin-inline: auto; padding: clamp(14px, 2.5vw, 24px); display: grid; gap: 14px; }
  .tour-search-top { display: flex; align-items: center; justify-content: space-between; gap: var(--s-3); }
  .tour-search-top b { font-size: var(--fs-lg); }
  .tour-search-row { display: grid; grid-template-columns: 46px minmax(0, 1fr) auto; align-items: center; gap: var(--s-3); padding-top: 12px; border-top: 1px solid var(--border); min-width: 0; }
  .tour-search-row img { width: 46px; height: 54px; object-fit: cover; border-radius: var(--r-2); }
  .tour-search-row div { display: grid; gap: 4px; min-width: 0; }
  .tour-search-row small { color: var(--text-2); font-size: var(--fs-xs); }
  .tour-search-action { white-space: nowrap; }
  .tour-roster { max-width: 620px; margin-inline: auto; padding: clamp(14px, 2.5vw, 24px); display: grid; gap: 0; }
  .tour-roster-head, .tour-roster-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: var(--s-3); }
  .tour-roster-head { padding-bottom: var(--s-3); color: var(--text-2); font: 500 var(--fs-xs) var(--mono); }
  .tour-roster-row { padding-block: 13px; border-top: 1px solid var(--border); }
  .tour-roster-person { display: flex; align-items: center; gap: var(--s-3); min-width: 0; }
  .tour-roster-person img { width: 42px; height: 50px; object-fit: cover; border-radius: var(--r-2); }
  .tour-roster-person div { display: grid; gap: 4px; min-width: 0; }
  .tour-roster-person small { color: var(--text-2); font-size: var(--fs-xs); }
  .tour-roster-deal { text-align: end; font-size: var(--fs-sm); }
  .tour-roster-deal small { display: block; margin-top: 3px; color: var(--text-2); font-size: var(--fs-xs); }
  .tour-choices { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--s-3); }
  .tour-choice { display: grid; align-content: space-between; gap: var(--s-4); min-height: 150px; padding: var(--s-4); color: var(--text); text-decoration: none; }
  .tour-choice:hover { border-color: var(--accent); translate: 0 -2px; }
  .tour-choice strong { font-size: var(--fs-xl); }
  .tour-choice span { display: flex; justify-content: space-between; align-items: center; gap: var(--s-2); color: var(--text-2); font-size: var(--fs-sm); }
  .tour-nav { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: var(--s-3); }
  .tour-nav .u-btn:last-child { justify-self: end; }
  .tour-nav .u-btn:disabled { opacity: 0.45; cursor: not-allowed; }
  .tour-live { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
  @media (max-width: 760px) {
    .tour-layout { grid-template-columns: minmax(0, 1fr); align-content: center; gap: clamp(14px, 3vh, 24px); }
    .tour-copy { gap: 10px; }
    .tour-copy h1 { max-width: 12ch; font-size: clamp(2.35rem, 10vw, 3.5rem); }
    .tour-copy p { max-width: 42ch; font-size: var(--fs-md); }
    .tour-video { min-height: 250px; grid-template-columns: minmax(110px, 0.7fr) minmax(0, 1fr); gap: 10px; padding: 9px; }
    .tour-video-copy { gap: 10px; padding: 2px; }
    .tour-video-copy q { font-size: clamp(1.2rem, 5vw, 1.7rem); }
    .tour-receipt-grid img { height: 160px; }
    .tour-choices { gap: 8px; }
    .tour-choice { min-height: 112px; padding: 12px; }
    .tour-choice strong { font-size: var(--fs-lg); }
  }
  @media (max-width: 500px) {
    .tour-header { padding-inline: var(--s-3); }
    .tour-header .u-logo small, .tour-email { display: none; }
    .tour-header #who { flex: none; }
    body.u-stage > header.u-bar.tour-header { height: 64px; min-height: 64px; flex-wrap: nowrap; padding-block: 0; }
    body.u-stage > header.u-bar.tour-header > .grow { display: block; }
    body.u-stage > header.u-bar.tour-header > #who { flex: 0 1 auto; }
    body.u-stage > header.u-bar.tour-header > #who:empty { display: none; }
    .tour-shell { width: calc(100% - 32px); min-height: calc(100svh - 64px); padding-block: 16px; gap: 14px; }
    .tour-progress { gap: 6px; }
    .tour-dots { gap: 2px; }
    .tour-dot { width: 24px; height: 24px; }
    .tour-layout { gap: 14px; }
    .tour-copy { gap: 8px; }
    .tour-copy h1 { font-size: clamp(2.2rem, 10vw, 2.8rem); }
    .tour-copy p { font-size: var(--fs-sm); line-height: 1.4; }
    .tour-video { min-height: 220px; grid-template-columns: minmax(92px, 0.62fr) minmax(0, 1fr); }
    .tour-video-copy q { font-size: clamp(1.05rem, 4.7vw, 1.35rem); }
    .tour-avatar { width: 28px; height: 28px; }
    .tour-receipt, .tour-pitch { padding: 14px; gap: 12px; }
    .tour-receipt-grid { grid-template-columns: 92px minmax(0, 1fr); gap: 12px; }
    .tour-receipt-grid img { height: 136px; }
    .tour-receipt q { font-size: 1.15rem; }
    .tour-search { padding: 12px; gap: 10px; }
    .tour-search-top b { font-size: var(--fs-md); }
    .tour-search-row { grid-template-columns: 38px minmax(0, 1fr); gap: 8px; }
    .tour-search-row img { width: 38px; height: 46px; }
    .tour-search-action { grid-column: 2; justify-self: start; }
    .tour-roster { padding: 12px; }
    .tour-roster-row { gap: 8px; }
    .tour-roster-person { gap: 8px; }
    .tour-roster-person img { width: 34px; height: 42px; }
    .tour-roster-deal { font-size: var(--fs-xs); }
    .tour-choices { grid-template-columns: 1fr; gap: 7px; }
    .tour-choice { min-height: 0; grid-template-columns: 1fr auto; align-items: center; gap: var(--s-2); padding: 10px 12px; }
    .tour-choice span { grid-column: 2; grid-row: 1; }
    .tour-nav { gap: 8px; }
    .tour-nav .u-btn { min-height: 40px; padding-inline: 12px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .tour-scene, .tour-dot::before, .tour-choice { transition: none; translate: none; }
    .tour-scene { opacity: 1; }
  }
  :root[data-motion="reduce"] .tour-scene { transition: none; translate: none; opacity: 1; }
}
</style>
</head>
<body class="u-stage">
<header class="u-bar tour-header">
  <a class="u-logo" href="/"><mark>Receipts</mark><small>60-second tour</small></a>
  <span class="grow"></span>
  <div id="who" aria-label="Account"></div>
  <span data-u-theme-toggle></span>
  <a class="u-btn u-btn-ghost u-btn-sm tour-skip" href="/">Skip tour</a>
</header>
<main class="tour-shell" id="tour">
  <div class="tour-progress">
    <span class="tour-progress-label" id="tour-progress-label">1 / 6</span>
    <nav class="tour-dots" id="tour-dots" aria-label="Tour steps"></nav>
  </div>
  <div class="tour-layout" id="tour-swipe">
    <section class="tour-copy">
      <h1 id="tour-headline" tabindex="-1">Creators mention brands every day.</h1>
      <p id="tour-copy">Unprompted, on camera. That's proof you already love them.</p>
    </section>
    <div class="tour-art" id="tour-art"></div>
  </div>
  <nav class="tour-nav" aria-label="Tour navigation">
    <button class="u-btn u-btn-ghost" id="tour-back" type="button">← Back</button>
    <button class="u-btn u-btn-primary" id="tour-next" type="button">Next →</button>
  </nav>
  <div class="tour-live" id="tour-live" aria-live="polite" aria-atomic="true"></div>
</main>
<script>
const { h } = U;
const $ = (selector) => document.querySelector(selector);
const quote = 'honestly Tim Hortons iced capp is my whole personality';
let user = null;
let currentStep = 0;
const photo = (src, alt, className) => h('img', { src, alt, class: className, loading: 'eager' });

function videoScene() {
  return h('article', { class: 'tour-demo tour-video tour-scene', 'data-reveal': '' },
    h('div', { class: 'tour-video-photo' }, photo('/demo/thumbs/maya-00.jpg', 'A homemade iced capp', ''),
      h('span', { class: 'tour-photo-label' }, 'TikTok · 0:09')),
    h('div', { class: 'tour-video-copy' },
      h('div', { class: 'tour-creator' }, photo('/demo/thumbs/maya-00.jpg', '', 'tour-avatar'), h('b', {}, '@maya.eats')),
      h('q', {}, quote),
      h('span', { class: 'tour-time' }, '0:09 · said on camera')));
}

function receiptScene() {
  return h('article', { class: 'tour-demo tour-receipt tour-scene', 'data-reveal': '' },
    h('div', { class: 'tour-receipt-head' },
      h('div', { class: 'tour-creator' }, photo('/demo/thumbs/maya-00.jpg', '', 'tour-avatar'), h('b', {}, '@maya.eats')),
      h('span', { class: 'tour-proof-label tour-said' }, 'Said on camera')),
    h('div', { class: 'tour-receipt-grid' },
      photo('/demo/thumbs/maya-00.jpg', 'Frame from the iced capp video', ''),
      h('q', {}, 'honestly ', h('mark', {}, 'Tim Hortons'), ' iced capp is my whole personality')),
    h('div', { class: 'tour-metrics' }, h('span', {}, '0:09 timestamp'), h('span', {}, '1.3M views')));
}

function pitchScene() {
  return h('article', { class: 'tour-demo tour-pitch tour-scene', 'data-reveal': '' },
    h('div', { class: 'tour-proof-label tour-said' }, 'New paid collab'),
    h('div', { class: 'tour-pitch-title' },
      h('strong', {}, '@maya.eats → Tim Hortons'),
      h('span', { class: 'u-muted' }, '2 TikToks · June · Proposal for new content')),
    h('div', { class: 'tour-pitch-money' }, h('b', {}, '$2,600'), h('span', {}, 'Future paid work')),
    h('div', { class: 'tour-proof' },
      photo('/demo/thumbs/maya-00.jpg', 'Receipt frame attached as proof', ''),
      h('div', { class: 'tour-proof-copy' },
        h('span', { class: 'tour-progress-label' }, 'PROOF FROM A PAST VIDEO · 0:09'),
        h('q', {}, quote))));
}

function searchScene() {
  const rows = [
    ['/demo/thumbs/maya-00.jpg', '@maya.eats', '4 mentions · 1.3M views'],
    ['/demo/thumbs/maya-09.jpg', '@noor.cooks', '2 mentions · 420K views'],
    ['/demo/thumbs/sami-04.jpg', '@sami.lifts', '1 mention · 86K views'],
  ];
  return h('article', { class: 'tour-demo tour-search tour-scene', 'data-reveal': '' },
    h('div', { class: 'tour-search-top' }, h('b', {}, 'Creators mentioning you'), h('span', { class: 'u-pill' }, 'Tim Hortons')),
    ...rows.map(([src, handle, details]) => h('div', { class: 'tour-search-row' },
      photo(src, '', ''),
      h('div', {}, h('b', {}, handle), h('small', {}, details)),
      h('button', { class: 'u-btn u-btn-sm u-btn-primary tour-search-action', type: 'button' }, 'Invite to collab'))));
}

function rosterScene() {
  const rows = [
    ['/demo/thumbs/maya-00.jpg', '@maya.eats', 'Tim Hortons · 4 mentions', '$2,600', 'New collab'],
    ['/demo/thumbs/sami-04.jpg', '@sami.lifts', 'Gymshark · 2 mentions', '$1,200', 'New deal'],
    ['/demo/thumbs/maya-09.jpg', '@noor.cooks', 'Talabat · 3 mentions', '$900', 'New deal'],
  ];
  return h('article', { class: 'tour-demo tour-roster tour-scene', 'data-reveal': '' },
    h('div', { class: 'tour-roster-head' }, h('span', {}, 'CREATOR · BRAND PROOF'), h('span', {}, 'FUTURE DEAL')),
    ...rows.map(([src, handle, brand, amount, label]) => h('div', { class: 'tour-roster-row' },
      h('div', { class: 'tour-roster-person' }, photo(src, '', ''), h('div', {}, h('b', {}, handle), h('small', {}, brand))),
      h('div', { class: 'tour-roster-deal' }, h('b', {}, amount), h('small', {}, label)))));
}

function hrefFor(role) {
  if (!user) return { creator: '/#handle', brand: '/brands/', manager: '/creators/roster' }[role];
  return role === 'manager' ? '/creators/roster' : `/dashboard?as=${role}`;
}

async function chooseSide(event, role) {
  event.preventDefault();
  const link = event.currentTarget;
  link.setAttribute('aria-busy', 'true');
  user = await me;
  if (!user) { location.href = hrefFor(role); return; }
  try {
    if (!U.hasRole(user, role)) user = await U.setRole(role, true);
    U.rememberSide(role);
    location.href = hrefFor(role);
  } catch (error) {
    link.removeAttribute('aria-busy');
    U.toast(error.message || 'That side could not be added.', { kind: 'error' });
  }
}

function choicesScene() {
  const sides = [
    ['creator', 'Creator', 'Proof for your next collab', '/#handle'],
    ['brand', 'Brand', 'Find creators who already love you', '/brands/'],
    ['manager', 'Manager', 'See every creator in your roster', '/creators/roster'],
  ];
  return h('div', { class: 'tour-choices tour-scene', 'data-reveal': '' },
    ...sides.map(([role, label, copy, signedOutHref]) => h('a', {
      class: 'tour-demo tour-choice', href: user ? hrefFor(role) : signedOutHref,
      onclick: (event) => chooseSide(event, role),
    }, h('strong', {}, label), h('span', {}, copy, h('b', { 'aria-hidden': 'true' }, '↗')))));
}

const steps = [
  { title: 'Creators mention brands every day.', copy: "Unprompted, on camera. That's proof you already love them.", visual: videoScene },
  { title: 'We turn each mention into a receipt.', copy: 'Quote, frame, timestamp, and views make past content proof.', visual: receiptScene },
  { title: 'Creators pitch their next paid collab.', copy: 'A receipt proves your fit; the offer pays for new work.', visual: pitchScene },
  { title: 'Brands find creators who already love them.', copy: 'Search authentic mentions, then invite creators to work together.', visual: searchScene },
  { title: 'Managers see the whole roster.', copy: 'Receipts show creator proof; deals track future paid work.', visual: rosterScene },
  { title: 'Pick your side.', copy: 'Start with the workspace that fits what you do.', visual: choicesScene },
];

function setStep(index, updateUrl = true) {
  currentStep = Math.max(0, Math.min(steps.length - 1, index));
  const step = steps[currentStep];
  $('#tour-progress-label').textContent = `${currentStep + 1} / ${steps.length}`;
  $('#tour-headline').textContent = step.title;
  $('#tour-copy').textContent = step.copy;
  $('#tour-art').replaceChildren(step.visual());
  $('#tour-live').textContent = `Step ${currentStep + 1} of ${steps.length}: ${step.title}`;
  $('#tour-back').disabled = currentStep === 0;
  $('#tour-next').textContent = currentStep === steps.length - 1 ? 'Finish →' : 'Next →';
  $('#tour-dots').replaceChildren(...steps.map((item, i) => {
    const attrs = { class: 'tour-dot', type: 'button', 'aria-label': `Go to step ${i + 1}: ${item.title}`, onclick: () => setStep(i) };
    if (i === currentStep) attrs['aria-current'] = 'step';
    return h('button', attrs);
  }));
  if (currentStep === steps.length - 1) {
    try { localStorage.setItem('u-tour-done', '1'); } catch {}
  }
  if (updateUrl) {
    const url = new URL(location.href);
    url.searchParams.set('step', String(currentStep + 1));
    history.replaceState(history.state, '', `${url.pathname}${url.search}${url.hash}`);
  }
  $('#tour-headline').focus({ preventScroll: true });
  window.M?.scan($('#tour-art'));
}

$('#tour-back').addEventListener('click', () => setStep(currentStep - 1));
$('#tour-next').addEventListener('click', () => {
  if (currentStep === steps.length - 1) location.href = '/';
  else setStep(currentStep + 1);
});
window.addEventListener('keydown', (event) => {
  if (event.altKey || event.ctrlKey || event.metaKey || event.defaultPrevented || /^(INPUT|TEXTAREA|SELECT)$/.test(event.target.tagName)) return;
  if (event.key === 'ArrowRight') { event.preventDefault(); setStep(currentStep + 1); }
  if (event.key === 'ArrowLeft') { event.preventDefault(); setStep(currentStep - 1); }
});
let touchStart = null;
$('#tour').addEventListener('touchstart', (event) => {
  const touch = event.changedTouches[0];
  touchStart = [touch.clientX, touch.clientY];
}, { passive: true });
$('#tour').addEventListener('touchend', (event) => {
  if (!touchStart) return;
  const touch = event.changedTouches[0];
  const dx = touch.clientX - touchStart[0], dy = touch.clientY - touchStart[1];
  if (Math.abs(dx) > 55 && Math.abs(dx) > Math.abs(dy)) setStep(currentStep + (dx < 0 ? 1 : -1));
  touchStart = null;
}, { passive: true });

const requested = Number.parseInt(new URLSearchParams(location.search).get('step') || '1', 10);
setStep(Number.isFinite(requested) ? requested - 1 : 0, false);
if (!Number.isFinite(requested) || requested < 1 || requested > steps.length) setStep(0);
document.addEventListener('DOMContentLoaded', () => window.M?.scan($('#tour-art')), { once: true });
const me = fetch('/api/creators/me').then((response) => response.ok ? response.json() : null)
  .then((data) => data?.user || null, () => null);
me.then((found) => {
  user = found;
  if (!user) return;
  $('#who').replaceChildren(U.sideSwitcher(user, U.hasRole(user, U.activeSide()) ? U.activeSide() : user.role),
    h('span', { class: 'tour-email' }, user.email));
  if (currentStep === steps.length - 1) {
    $('#tour-art').replaceChildren(choicesScene());
    window.M?.scan($('#tour-art'));
  }
}).catch(() => {});
</script>
</body>
</html>
