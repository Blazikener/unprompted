<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>License a video · Unprompted</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=Newsreader:ital,opsz,wght@1,6..72,400;1,6..72,500&family=Schibsted+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --lime: oklch(0.92 0.19 122); --bg: oklch(0.985 0.005 160); --panel: #fff; --ink: oklch(0.21 0.025 160); --ink-2: oklch(0.46 0.02 160);
    --line: oklch(0.915 0.01 160); --moss: oklch(0.44 0.12 160); --moss-soft: oklch(0.955 0.03 160); --coral: oklch(0.55 0.2 27); --coral-soft: oklch(0.965 0.03 25);
    --sans: "Schibsted Grotesk", ui-sans-serif, system-ui, sans-serif; --serif: "Newsreader", ui-serif, Georgia, serif; --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 var(--sans); -webkit-font-smoothing: antialiased; }
  main { max-width: 640px; margin: 0 auto; padding: 40px 20px 60px; }
  .brand { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 28px; }
  .brand a { color: var(--ink); text-decoration: none; font-weight: 700; letter-spacing: -0.01em; }
  .brand span { font: 500 0.6875rem var(--mono); letter-spacing: 0.04em; text-transform: uppercase; color: var(--ink-2); }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 26px 28px; }
  h1 { margin: 0 0 6px; font: italic 500 1.75rem/1.2 var(--serif); letter-spacing: -0.01em; text-wrap: pretty; }
  .sub { margin: 0 0 20px; color: var(--ink-2); text-wrap: pretty; }
  .video { margin: 0 0 22px; padding: 16px 18px; border-radius: 12px; background: var(--moss-soft); }
  .video blockquote { margin: 0 0 10px; font: italic 400 1.1875rem/1.45 var(--serif); text-wrap: pretty; }
  .video blockquote b { font-style: normal; font-family: var(--sans); font-weight: 600; background: var(--lime); padding: 0 3px; border-radius: 3px; }
  .video .meta { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 0.8125rem; color: var(--ink-2); }
  .video a { color: var(--moss); }
  fieldset { margin: 0 0 16px; padding: 0; border: 0; }
  legend { margin-bottom: 8px; font-weight: 600; font-size: 0.875rem; }
  .opts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
  .opts label { display: grid; gap: 2px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; cursor: pointer; }
  .opts label:has(input:checked) { border-color: var(--moss); box-shadow: inset 0 0 0 1px var(--moss); }
  .opts label:has(input:focus-visible) { outline: 2px solid var(--moss); outline-offset: 2px; }
  .opts input { position: absolute; opacity: 0; }
  .opts b { font-size: 1.0625rem; }
  .opts span { font-size: 0.8125rem; color: var(--ink-2); }
  label.note { display: block; margin-bottom: 6px; font-weight: 600; font-size: 0.875rem; }
  textarea { width: 100%; min-height: 76px; margin: 0 0 16px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; font: inherit; resize: vertical; }
  textarea:focus-visible { outline: 2px solid var(--moss); outline-offset: 1px; }
  .btn { height: 42px; padding: 0 18px; border-radius: 9px; border: 0; background: var(--lime); color: var(--ink); font: 600 0.9375rem var(--sans); cursor: pointer; }
  .btn:disabled { opacity: 0.5; cursor: default; }
  .basis { margin: 14px 0 0; font-size: 0.75rem; color: var(--ink-2); }
  .status { margin: 0 0 6px; padding: 14px 16px; border-radius: 12px; background: var(--moss-soft); }
  .status b { display: block; margin-bottom: 2px; }
  .status.declined { background: var(--coral-soft); }
  .err { color: var(--coral); }
  .back { display: inline-block; margin-top: 18px; color: var(--moss); font-size: 0.875rem; }
  footer { margin-top: 28px; font: 500 0.6875rem var(--mono); letter-spacing: 0.04em; text-transform: uppercase; color: var(--ink-2); }
  footer a { color: inherit; }
  @media (max-width: 520px) { .card { padding: 22px 18px; } .opts { grid-template-columns: minmax(0, 1fr); } }
</style>
</head>
<body>
<main>
  <div class="brand"><a href="/brands/">Unprompted</a><span>License for ads</span></div>
  <section class="card" id="card" aria-live="polite"><p class="sub">Loading the video…</p></section>
  <footer>Search and transcripts by <a href="https://oriane.xyz" target="_blank" rel="noopener">Oriane</a> · Unprompted is a community tool built on Oriane's API</footer>
</main>
<script>
  const $ = (s) => document.querySelector(s);
  const [, , token, vid] = location.pathname.split('/');
  const api = `/api/digests/${token}/license/${vid}`;
  const KIND = { spoken: 'Said on camera only', tagged: 'Tagged in caption' };
  const STATUS = {
    requested: ['Requested', 'We’re contacting the creator to confirm their terms. Nothing is charged until they agree and you approve the final price.'],
    contacted: ['Creator contacted', 'We’ve reached the creator and are waiting on their answer.'],
    accepted: ['Creator accepted', 'The creator agreed. We’ll send you the final terms and the ad code.'],
    declined: ['Creator declined', 'The creator said no to this one. Nothing was charged.'],
    live: ['Live', 'The license is active.'],
  };
  const when = (iso) => iso ? new Date(iso).toLocaleDateString(undefined, { day: 'numeric', month: 'short', year: 'numeric' }) : '';
  const fmt = (n) => n >= 1e6 ? `${(n / 1e6).toFixed(1).replace(/\.0$/, '')}M` : n >= 1e3 ? `${(n / 1e3).toFixed(1).replace(/\.0$/, '')}K` : String(n);
  function h(tag, attrs, ...kids) {
    const el = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs || {})) { if (k.startsWith('on')) el.addEventListener(k.slice(2), v); else if (v != null) el.setAttribute(k, v); }
    el.append(...kids.filter((k) => k != null));
    return el;
  }
  async function call(body) {
    const res = await fetch(api, body ? { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) } : {});
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Something went wrong.');
    return data;
  }
  function quote(v) {
    const q = v.quote;
    if (!q) return h('blockquote', {}, v.caption || 'No quote captured for this video.');
    const [a, b] = q.hit;
    return h('blockquote', { dir: 'auto' }, '“', q.text.slice(0, a), h('b', {}, q.text.slice(a, b)), q.text.slice(b), '”');
  }
  function render(d) {
    const v = d.video, platform = v.platform === 'tiktok' ? 'TikTok' : 'Instagram';
    const at = v.quote && v.quote.start != null ? ` at ${Math.floor(v.quote.start / 60)}:${String(Math.floor(v.quote.start % 60)).padStart(2, '0')}` : '';
    const video = h('div', { class: 'video' }, quote(v), h('div', { class: 'meta' },
      h('a', { href: v.profile, target: '_blank', rel: 'noopener' }, `@${v.handle}`),
      h('span', {}, `${platform} · ${fmt(v.views)} views`), h('span', {}, KIND[v.kind]),
      v.publishedAt ? h('span', {}, `Posted ${when(v.publishedAt)}`) : null,
      h('a', { href: v.url, target: '_blank', rel: 'noopener' }, `Watch${at} ↗`)));
    const back = h('a', { class: 'back', href: d.manageUrl }, `← Your weekly ${d.brand} watch`);
    if (d.request) {
      const r = d.request, [title, text] = STATUS[r.status] || [r.status, ''];
      $('#card').replaceChildren(
        h('h1', {}, `@${v.handle}’s video for ${d.brand}`),
        h('div', { class: `status ${r.status}` }, h('b', {}, `${title}: ${r.days} days at ~$${r.priceUsd}`), text),
        h('p', { class: 'sub' }, `Requested ${when(r.createdAt)}. Updates go to ${d.email}.`), video, back);
      return;
    }
    const opts = h('div', { class: 'opts' }, ...d.prices.map((p, i) => h('label', {},
      h('input', { type: 'radio', name: 'days', value: p.days, checked: i === 0 ? '' : null }),
      h('b', {}, `~$${p.usd}`), h('span', {}, `${p.days} days`))));
    const note = h('textarea', { id: 'note', maxlength: '500', placeholder: 'Campaign, markets, start date…' });
    const err = h('p', { class: 'err', role: 'alert', hidden: '' });
    const btn = h('button', { class: 'btn', type: 'submit' }, 'Request license');
    const form = h('form', { onsubmit: async (e) => {
      e.preventDefault();
      btn.disabled = true;
      err.hidden = true;
      try { render(await call({ days: Number(form.elements.days.value), note: note.value })); }
      catch (ex) { err.textContent = ex.message; err.hidden = false; btn.disabled = false; }
    } }, h('fieldset', {}, h('legend', {}, 'How long should the ad run?'), opts),
      h('label', { class: 'note', for: 'note' }, 'Note for the creator (optional)'), note, err, btn);
    $('#card').replaceChildren(
      h('h1', {}, `Run @${v.handle}’s video as an ad`),
      h('p', { class: 'sub' }, `License this video for ${d.brand} as a TikTok Spark Ad or Instagram partnership ad. We contact @${v.handle}, confirm their price and terms, and only then send you the final offer. Nothing is charged now.`),
      video, form, h('p', { class: 'basis' }, d.basis), back);
  }
  call().then(render).catch((ex) => {
    $('#card').replaceChildren(h('h1', {}, 'This link isn’t valid any more.'), h('p', { class: 'sub' }, ex.message, ' ', h('a', { href: '/brands/' }, 'Go to Unprompted'), '.'));
  });
</script>
</body>
</html>
