<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Your weekly watch · Unprompted</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=Newsreader:ital,opsz,wght@1,6..72,400;1,6..72,500&family=Schibsted+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --forest: oklch(0.26 0.055 160); --forest-2: oklch(0.315 0.06 160); --on-forest: oklch(0.97 0.01 160); --on-forest-2: oklch(0.81 0.035 160);
    --lime: oklch(0.92 0.19 122); --bg: oklch(0.985 0.005 160); --panel: #fff; --ink: oklch(0.21 0.025 160); --ink-2: oklch(0.46 0.02 160);
    --line: oklch(0.915 0.01 160); --moss: oklch(0.44 0.12 160); --moss-soft: oklch(0.955 0.03 160); --coral: oklch(0.55 0.2 27); --coral-soft: oklch(0.965 0.03 25);
    --sans: "Schibsted Grotesk", ui-sans-serif, system-ui, sans-serif; --serif: "Newsreader", ui-serif, Georgia, serif; --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 var(--sans); -webkit-font-smoothing: antialiased; }
  main { max-width: 680px; margin: 0 auto; padding: 40px 20px 60px; }
  .brand { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 28px; }
  .brand a { color: var(--ink); text-decoration: none; font-weight: 700; letter-spacing: -0.01em; }
  .brand span { font: 500 0.6875rem var(--mono); letter-spacing: 0.04em; text-transform: uppercase; color: var(--ink-2); }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 26px 28px; }
  h1 { margin: 0 0 6px; font: italic 500 1.75rem/1.2 var(--serif); letter-spacing: -0.01em; text-wrap: pretty; }
  .sub { margin: 0 0 18px; color: var(--ink-2); }
  .pill { display: inline-flex; align-items: center; height: 22px; padding: 0 8px; border-radius: 999px; font: 500 0.6875rem var(--mono); letter-spacing: 0.04em; text-transform: uppercase; background: var(--moss-soft); color: var(--moss); vertical-align: 2px; }
  .pill.paused, .pill.pending { background: var(--coral-soft); color: var(--coral); }
  dl { display: grid; grid-template-columns: max-content 1fr; gap: 6px 18px; margin: 0 0 20px; font-size: 0.875rem; }
  dt { color: var(--ink-2); } dd { margin: 0; }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; }
  .btn { height: 38px; padding: 0 16px; border-radius: 8px; border: 1px solid var(--line); background: #fff; color: var(--ink); font: 600 0.875rem var(--sans); cursor: pointer; }
  a.btn { display: inline-flex; align-items: center; text-decoration: none; }
  .btn-primary { background: var(--lime); border-color: transparent; }
  .btn-danger { color: var(--coral); }
  .btn:disabled { opacity: 0.5; cursor: default; }
  h2 { margin: 30px 0 10px; font-size: 1rem; }
  .runs { list-style: none; margin: 0; padding: 0; font-size: 0.875rem; }
  .runs li { display: flex; justify-content: space-between; gap: 12px; padding: 8px 0; border-top: 1px solid var(--line); }
  .runs a { color: var(--moss); }
  iframe { width: 100%; height: 720px; border: 1px solid var(--line); border-radius: 12px; background: #f3f6f4; }
  .muted { color: var(--ink-2); font-size: 0.875rem; }
  .err { color: var(--coral); }
  #seeding { margin-top: 18px; }
  #seeding h2 { margin: 0 0 6px; }
  #seeding textarea { width: 100%; min-height: 110px; margin: 8px 0; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; font: 0.875rem/1.5 var(--mono); resize: vertical; }
  #seeding textarea:focus-visible, #seeding input:focus-visible { outline: 2px solid var(--moss); outline-offset: 1px; }
  .tally { margin: 0 0 10px; }
  .tally b { color: var(--moss); }
  .gifts { list-style: none; margin: 12px 0 0; padding: 0; font-size: 0.875rem; }
  .gifts li { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 4px 12px; padding: 8px 0; border-top: 1px solid var(--line); }
  .gifts a { color: var(--moss); }
  footer { margin-top: 28px; font: 500 0.6875rem var(--mono); letter-spacing: 0.04em; text-transform: uppercase; color: var(--ink-2); }
  footer a { color: inherit; }
</style>
</head>
<body>
<main>
  <div class="brand"><a href="/brands/">Unprompted</a><span>Weekly watch</span></div>
  <section class="card" id="card"><p class="muted">Loading your watch…</p></section>
  <section class="card" id="seeding" hidden></section>
  <h2 id="lic-h" hidden>License requests</h2>
  <ol class="runs" id="licenses"></ol>
  <h2 id="runs-h" hidden>Past weekly checks</h2>
  <ol class="runs" id="runs"></ol>
  <h2 id="preview-h" hidden>Latest email</h2>
  <iframe id="preview" title="Latest digest email" hidden sandbox></iframe>
  <footer>Search and transcripts by <a href="https://oriane.xyz" target="_blank" rel="noopener">Oriane</a> · Unprompted is a community tool built on Oriane's API</footer>
</main>
<script>
  const $ = (s) => document.querySelector(s);
  const token = location.pathname.split('/').pop();
  const q = new URLSearchParams(location.search);
  const PLATFORM = { all: 'Instagram and TikTok', instagram: 'Instagram', tiktok: 'TikTok' };
  const LANG = { any: 'any language', en: 'English', ar: 'Arabic' };
  const LICENSE = { requested: 'contacting the creator', contacted: 'creator contacted', accepted: 'creator accepted', declined: 'creator declined', live: 'live' };
  const when = (iso) => iso ? new Date(iso).toLocaleDateString(undefined, { day: 'numeric', month: 'short', year: 'numeric' }) : '—';
  function h(tag, attrs, ...kids) {
    const el = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs || {})) { if (k === 'hidden') el.hidden = v; else if (k.startsWith('on')) el.addEventListener(k.slice(2), v); else el.setAttribute(k, v); }
    el.append(...kids.filter((k) => k != null));
    return el;
  }
  async function api(path, method = 'GET') {
    const res = await fetch(path, method === 'GET' ? {} : { method, headers: { 'Content-Type': 'application/json' }, body: '{}' });
    const body = await res.json();
    if (!res.ok) throw new Error(body.error || 'Something went wrong.');
    return body;
  }
  // Gifted creators (seeding.py): the gifting list, and which of them posted about the brand after it shipped.
  function seeding(d) {
    const box = $('#seeding'), s = d.seeding;
    if (!s) { box.hidden = true; return; }
    box.hidden = false;
    const text = h('textarea', { id: 'gift-list', 'aria-label': 'Gifting list', placeholder: 'One creator per line: handle or profile URL, platform, ship date, tracked\n@maya.eats, tiktok, 2026-09-14\nhttps://www.instagram.com/sami.lifts, 2026-09-20, yes' });
    const file = h('input', { type: 'file', accept: '.csv,.txt,text/csv,text/plain', 'aria-label': 'Upload a CSV', onchange: async (e) => {
      const f = e.target.files[0]; if (f) text.value = (await f.text()).slice(0, 200000);
    } });
    const msg = h('p', { class: 'muted', role: 'status' });
    const post = async (path, body) => {
      const res = await fetch(path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
      const out = await res.json();
      if (!res.ok) throw new Error(out.error || 'Something went wrong.');
      return out;
    };
    const add = h('button', { class: 'btn btn-primary', type: 'button', onclick: async () => {
      add.disabled = true; msg.textContent = 'Adding, and checking TikTok creators now…';
      try {
        const out = await post(`/api/digests/${token}/gifts`, { text: text.value });
        seeding({ ...d, seeding: out.seeding });
        $('#seeding .status-line').textContent = `Added ${out.added}.` + (out.skipped.length ? ` Skipped ${out.skipped.length}: ` + out.skipped.slice(0, 5).map((x) => `line ${x.line} (${x.reason})`).join(', ') : '');
      } catch (ex) { msg.textContent = ex.message; msg.className = 'err'; add.disabled = false; }
    } }, 'Add creators');
    const clear = s.gifted ? h('button', { class: 'btn', type: 'button', onclick: async (e) => {
      if (!confirm('Remove the whole gifting list?')) return;
      e.target.disabled = true;
      try { seeding({ ...d, seeding: (await post(`/api/digests/${token}/gifts/clear`, {})).seeding }); } catch (ex) { msg.textContent = ex.message; }
    } }, 'Clear list') : null;
    const tally = s.gifted ? h('p', { class: 'tally' }, h('b', {}, `${s.posted} of ${s.gifted}`), ' gifted creators have posted',
      s.spokenOnly ? `, ${s.spokenOnly} of them only on camera (no tag to track)` : '', '.',
      s.tracked ? ` Your own tracking had ${s.tracked}` + (s.multiple > 1 ? `: we found ${s.multiple}× as many.` : '.') : '') :
      h('p', { class: 'sub', style: 'margin:0 0 6px' }, `Paste the creators you sent ${d.brand} to. Each weekly check looks for their first post about it after it shipped, including the ones that only say it on camera.`);
    const list = s.gifts.length ? h('ul', { class: 'gifts' }, ...s.gifts.slice(0, 200).map((g) => h('li', {},
      h('span', {}, h('b', {}, `@${g.handle}`), ` · ${g.platform === 'tiktok' ? 'TikTok' : 'Instagram'} · shipped ${when(g.shippedOn)}${g.tracked ? ' · you tracked it' : ''}`),
      g.videoId ? h('span', {}, `${g.kind === 'spoken' ? 'Said it on camera' : g.kind === 'tagged' ? 'Tagged' : 'Disclosed post'} ${when(g.postedOn)} `, g.url ? h('a', { href: g.url, target: '_blank', rel: 'noopener' }, 'Watch ↗') : null,
        g.licenseUrl ? h('a', { href: g.licenseUrl, style: 'margin-left:10px' }, 'License for ads') : null)
        : h('span', { class: 'muted' }, g.checkedAt ? `No post yet (checked ${when(g.checkedAt)})` : 'Checked in the next weekly run')))) : null;
    box.replaceChildren(h('h2', {}, 'Gifted creators'), tally, h('p', { class: 'muted status-line' }), text,
      h('div', { class: 'actions' }, file, add, clear), msg, list);
  }
  function render(d) {
    const card = $('#card');
    if (d.status === 'unsubscribed') {
      card.replaceChildren(h('h1', {}, 'Stopped watching.'), h('p', { class: 'sub' }, `No more ${d.brand} reports to ${d.email}. `, h('a', { href: '/brands/' }, 'Run a new search'), ' any time.'));
      return;
    }
    const act = (label, action, cls = '') => h('button', { class: `btn ${cls}`, type: 'button', onclick: async (e) => {
      e.target.disabled = true;
      try { render(await api(`/api/digests/${token}/${action}`, 'POST')); } catch (err) { card.append(h('p', { class: 'err' }, err.message)); e.target.disabled = false; }
    } }, label);
    const unsubscribe = h('button', { class: 'btn btn-danger', type: 'button', onclick: (e) => {
      e.target.replaceWith(h('span', { class: 'muted' }, 'Stop all ', d.brand, ' reports? ', act('Yes, stop', 'unsubscribe', 'btn-danger')));
    } }, 'Stop watching');
    const status = { active: 'Watching', paused: 'Paused', pending: 'Confirm your email' }[d.status];
    // Due a week after the last check; a new watch is due on the next scheduler pass.
    const next = d.lastRunAt ? when(new Date(d.lastRunAt).getTime() + d.every * 864e5) : 'Due now (first check)';
    card.replaceChildren(
      h('h1', {}, 'Weekly watch: ', d.brand, ' ', h('span', { class: `pill ${d.status}` }, status)),
      h('p', { class: 'sub' }, d.status === 'pending'
        ? (d.mail ? `We emailed ${d.email} a confirmation link. Nothing is sent until you click it.` : 'Mail isn\'t configured on this server yet, so confirm here:')
        : d.status === 'paused' ? 'Paused. Resume whenever you want the next one.'
        : `Every ${d.every} days we search Oriane for new videos mentioning ${d.brand} and email ${d.email} a report of the ones you haven't seen. Weeks with nothing new send no email.`),
      h('dl', {},
        h('dt', {}, 'Listening for'), h('dd', {}, [d.brand, ...(d.params.variants || [])].join(', ')),
        h('dt', {}, 'Where'), h('dd', {}, `${PLATFORM[d.params.platform]}, ${LANG[d.params.lang]}`),
        h('dt', {}, 'Saved'), h('dd', {}, when(d.createdAt)),
        h('dt', {}, 'Last checked'), h('dd', {}, when(d.lastRunAt)),
        d.status === 'active' ? h('dt', {}, 'Next check') : null, d.status === 'active' ? h('dd', {}, next) : null),
      h('div', { class: 'actions' },
        d.status === 'pending' ? act('Start watching', 'confirm', 'btn-primary') : d.status === 'paused' ? act('Resume', 'resume', 'btn-primary') : act('Pause', 'pause'),
        unsubscribe));
    $('#lic-h').hidden = !d.licenses.length;
    $('#licenses').replaceChildren(...d.licenses.map((l) => h('li', {},
      h('span', {}, `@${l.handle} · ${l.days} days · ~$${l.priceUsd} · ${LICENSE[l.status] || l.status}`), h('a', { href: l.url }, 'Details →'))));
    seeding(d);
    $('#runs-h').hidden = !d.runs.length;
    $('#runs').replaceChildren(...d.runs.map((r) => h('li', {},
      h('span', {}, when(r.createdAt), ' · ', r.newCount ? `${r.newCount} new` : 'nothing new', r.newCount && !r.sent ? ' (not emailed: mail not configured)' : ''),
      r.searchId ? h('a', { href: `/brands/#search=${r.searchId}` }, 'Dashboard →') : null)));
    $('#preview-h').hidden = !d.latestHtml;
    preview(d.latestHtml);
  }
  function renderSample(d) {
    document.title = 'Sample weekly report · Unprompted';
    $('#card').replaceChildren(
      h('h1', {}, 'Sample weekly report'),
      h('p', { class: 'sub' }, `${d.newCount} new ${d.newCount === 1 ? 'creator mention' : 'creator mentions'} of ${d.brand}.`),
      h('p', { class: 'sub' }, 'Watch a search on the dashboard and this lands in your inbox every 7 days, with only the mentions you haven\'t seen.'),
      h('div', { class: 'actions' }, h('a', { class: 'btn btn-primary', href: '/brands/' }, 'Get this for your brand')));
    $('#runs-h').hidden = true;
    $('#runs').replaceChildren();
    $('#preview-h').textContent = 'Email preview';
    $('#preview-h').hidden = !d.html;
    preview(d.html);
  }
  let latestHtml = null;
  // A fresh iframe each time: on a back/forward navigation the browser restores the old frame's own history entry
  // instead of loading srcdoc, which leaves the preview blank.
  function preview(html) {
    latestHtml = html;
    const old = $('#preview');
    const frame = h('iframe', { id: 'preview', title: 'Latest digest email', sandbox: '', hidden: !html });
    if (html) frame.srcdoc = html;
    old.replaceWith(frame);
  }
  window.addEventListener('pageshow', (e) => { if (e.persisted && latestHtml) preview(latestHtml); });
  (async () => {
    try {
      if (token === 'sample') {
        renderSample(await api('/api/digests/sample'));
        return;
      }
      let d = await api(`/api/digests/${token}`);
      if (q.get('confirm') === '1' && d.status === 'pending') d = await api(`/api/digests/${token}/confirm`, 'POST');
      render(d);
      if (q.get('unsubscribe') === '1') document.querySelector('.btn-danger')?.click();
    } catch (err) {
      $('#card').replaceChildren(h('h1', {}, 'This link isn\'t valid any more.'), h('p', { class: 'sub' }, err.message, ' ', h('a', { href: '/brands/' }, 'Start a new search'), '.'));
    }
  })();
</script>
</body>
</html>
